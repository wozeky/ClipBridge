name: OBS replay smoke test

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/obs-replay.yml
      - tools/Test-ObsReplay.ps1
      - tools/ClipBridge.Bench/ObsSmoke.cs

permissions:
  contents: read

jobs:
  replay:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Save two MP4 replays with OBS Studio
        shell: pwsh
        run: ./tools/Test-ObsReplay.ps1
