name: Windows x64

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore RollClip.slnx
      - name: Build
        run: dotnet build RollClip.slnx -c Release --no-restore
      - name: Test
        run: dotnet test RollClip.slnx -c Release --no-build --verbosity normal
      - name: Publish Windows x64
        run: dotnet publish src/RollClip.App -c Release -r win-x64 --self-contained true -o artifacts/win-x64
      - name: Bundle pinned Windows Graphics Capture engine
        shell: pwsh
        run: |
          ./tools/Install-CaptureEngine.ps1 -Destination artifacts/win-x64/ffmpeg
          $ffmpeg = (Resolve-Path ./artifacts/win-x64/ffmpeg/bin/ffmpeg.exe).Path
          $encoders = & $ffmpeg -hide_banner -encoders
          foreach ($encoder in 'h264_nvenc', 'h264_amf', 'h264_qsv', 'h264_mf') {
            if (-not ($encoders -match "\b$encoder\b")) { throw "Missing H.264 encoder: $encoder" }
          }
          $encoders -match '\bh264_(nvenc|amf|mf)\b'
      - name: Verify bundled material decodes completely
        shell: pwsh
        run: |
          $ffmpeg = (Resolve-Path ./artifacts/win-x64/ffmpeg/bin/ffmpeg.exe).Path
          foreach ($material in Get-ChildItem ./artifacts/win-x64/Assets/ChromeLoop*.mp4) {
            & $ffmpeg -v error -xerror -i $material.FullName -f null -
            if ($LASTEXITCODE -ne 0) { throw "Chrome loop decoding failed: $material" }
          }
      - name: Verify rolling buffer and MP4 export with synthetic input
        shell: pwsh
        run: |
          $ffmpeg = (Resolve-Path ./artifacts/win-x64/ffmpeg/bin/ffmpeg.exe).Path
          dotnet run --project tools/RollClip.Bench -c Release --no-build -- replay-smoke $ffmpeg (Join-Path $env:RUNNER_TEMP "rollclip-replay")
      - name: Verify trimmed Discord MP4
        shell: pwsh
        run: |
          $ffmpeg = (Resolve-Path ./artifacts/win-x64/ffmpeg/bin/ffmpeg.exe).Path
          $directory = Join-Path $env:RUNNER_TEMP "rollclip-replay"
          $output = Join-Path $directory "discord.mp4"
          dotnet run --project tools/RollClip.Bench -c Release --no-build -- export-smoke $ffmpeg (Join-Path $directory "replay-0.mp4") $output
          if ($LASTEXITCODE -ne 0) { throw "Discord export failed." }
          & $ffmpeg -v error -xerror -i $output -map 0:v -map 0:a -f null -
          if ($LASTEXITCODE -ne 0) { throw "Discord MP4 did not decode with video and audio." }
      - name: Verify WPF startup and diagnostics clipboard
        shell: pwsh
        run: |
          $marker = Join-Path $env:RUNNER_TEMP "rollclip-window.txt"
          Remove-Item -LiteralPath $marker -ErrorAction SilentlyContinue
          $app = Start-Process -FilePath "./artifacts/win-x64/RollClip.exe" -ArgumentList "--smoke-test", "`"$marker`"" -PassThru
          if (-not $app.WaitForExit(30000)) {
            Stop-Process -Id $app.Id -Force
            throw "RollClip did not exit after rendering the window."
          }
          if (Test-Path -LiteralPath $marker) { Get-Content -LiteralPath $marker }
          if ($app.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $marker)) {
            throw "RollClip did not render the window successfully. Exit code: $($app.ExitCode)"
          }
          $screenshot = [IO.Path]::ChangeExtension($marker, ".png")
          if (-not (Test-Path -LiteralPath $screenshot)) {
            throw "WPF did not export the real application screenshot."
          }
      - name: Verify animated chrome and pause lifecycle on hosted Windows
        shell: pwsh
        run: |
          $marker = Join-Path $env:RUNNER_TEMP "rollclip-material.txt"
          $app = Start-Process -FilePath "./artifacts/win-x64/RollClip.exe" -ArgumentList "--material-smoke", "`"$marker`"" -PassThru
          if (-not $app.WaitForExit(30000)) {
            Stop-Process -Id $app.Id -Force
            throw "Material probe timed out."
          }
          if (Test-Path $marker) { Get-Content $marker }
          if ($app.ExitCode -ne 0 -or -not (Test-Path $marker) -or -not ((Get-Content $marker -Raw).StartsWith("PASS:"))) {
            throw "Hosted video material playback was not verified."
          }
      - name: Upload native WPF views and material probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RollClip-WPF-screenshot
          path: |
            ${{ runner.temp }}/rollclip-window*.png
            ${{ runner.temp }}/rollclip-material*.png
            ${{ runner.temp }}/rollclip-material.txt
            ${{ runner.temp }}/rollclip-window.txt
          if-no-files-found: warn
      - name: Probe native window recording on the hosted desktop
        continue-on-error: true
        shell: pwsh
        run: |
          $marker = Join-Path $env:RUNNER_TEMP "rollclip-capture.txt"
          $app = Start-Process -FilePath "./artifacts/win-x64/RollClip.exe" -ArgumentList "--capture-smoke", "`"$marker`"" -PassThru
          if (-not $app.WaitForExit(55000)) {
            Stop-Process -Id $app.Id -Force
            throw "The hosted desktop capture timed out."
          }
          if (Test-Path -LiteralPath $marker) { Get-Content -LiteralPath $marker }
          if ($app.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $marker)) {
            throw "Native window recording failed on this runner."
          }
          $clip = (Get-Content -LiteralPath $marker)[1]
          $ffmpeg = (Resolve-Path ./artifacts/win-x64/ffmpeg/bin/ffmpeg.exe).Path
          $decoded = & $ffmpeg -hide_banner -i $clip -vf "blackdetect=d=0.5:pix_th=0.1:pic_th=0.98" -an -f null - 2>&1
          if ($LASTEXITCODE -ne 0 -or ($decoded -match "black_start:")) {
            $decoded
            throw "The captured window clip did not decode into visible frames."
          }
          $video = $decoded -match 'Video:.*1280x720.*30 fps'
          if (-not $video) { throw "The Light profile did not produce 720p at 30 FPS." }
          $video
      - name: Verify distribution contents
        shell: pwsh
        run: |
          foreach ($file in 'RollClip.exe', 'RollClip.dll', 'RollClip.Core.dll', 'RollClip.runtimeconfig.json', 'Assets/ChromeLoop.mp4', 'Assets/ChromeLoopOverlay.mp4', 'ffmpeg/bin/ffmpeg.exe', 'licenses/WKI-Clipper.txt', 'LICENSE') {
            if (-not (Test-Path -LiteralPath (Join-Path 'artifacts/win-x64' $file) -PathType Leaf)) {
              throw "Missing distribution file: $file"
            }
          }
      - name: Sign RollClip executable when a certificate is configured
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          if (-not $env:SIGN_PFX_BASE64) { return }
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin/*/x64/signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
            if (-not $signtool) { throw "signtool.exe not found." }
            & $signtool sign /f $pfx /p $env:SIGN_PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "./artifacts/win-x64/RollClip.exe"
            if ($LASTEXITCODE -ne 0) { throw "RollClip signing failed." }
          } finally {
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
          }
      - name: Build and test the per-user installer
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) { throw "Inno Setup is missing from the Windows runner." }
          $package = (Resolve-Path ./artifacts/win-x64).Path
          $output = (New-Item -ItemType Directory -Force ./artifacts/installer).FullName
          & $compiler "/DPackageDir=$package" "/O$output" ./packaging/RollClip.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup build failed." }
          $setup = Join-Path $output 'RollClip-Setup-win-x64.exe'
          $install = Join-Path $env:RUNNER_TEMP 'rollclip-install-check'
          $log = Join-Path $env:RUNNER_TEMP 'rollclip-install.log'
          $setupArgs = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/LANG=tr', "/DIR=`"$install`"", "/LOG=`"$log`"")
          $process = Start-Process -FilePath $setup -ArgumentList $setupArgs -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log }
            throw "Silent installer smoke failed: $($process.ExitCode)"
          }
          foreach ($file in 'RollClip.exe', 'ffmpeg/bin/ffmpeg.exe', 'unins000.exe') {
            if (-not (Test-Path -LiteralPath (Join-Path $install $file))) { throw "Installed file missing: $file" }
          }
          $uninstall = Start-Process -FilePath (Join-Path $install 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0 -or (Test-Path -LiteralPath (Join-Path $install 'RollClip.exe'))) {
            throw "Silent uninstaller smoke failed."
          }
      - name: Sign installer when a certificate is configured
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          if (-not $env:SIGN_PFX_BASE64) { return }
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin/*/x64/signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
            if (-not $signtool) { throw "signtool.exe not found." }
            & $signtool sign /f $pfx /p $env:SIGN_PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "./artifacts/installer/RollClip-Setup-win-x64.exe"
            if ($LASTEXITCODE -ne 0) { throw "Installer signing failed." }
          } finally {
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        with:
          name: RollClip-Setup-win-x64
          path: artifacts/installer/RollClip-Setup-win-x64.exe
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: RollClip-win-x64
          path: artifacts/win-x64/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish verified Windows preview
    needs: windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release v0.4.8]')
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: RollClip-win-x64
          path: release/win-x64
      - uses: actions/download-artifact@v4
        with:
          name: RollClip-Setup-win-x64
          path: release/installer
      - uses: actions/download-artifact@v4
        with:
          name: RollClip-WPF-screenshot
          path: release/screenshots
      - name: Package and publish GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = 'v0.4.8'
          $asset = 'RollClip-win-x64.zip'
          Compress-Archive -Path './release/win-x64/*' -DestinationPath $asset
          $installer = 'RollClip-Setup-win-x64.exe'
          Copy-Item -LiteralPath "./release/installer/$installer" -Destination $installer
          foreach ($file in $asset, $installer) {
            $checksum = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$checksum  $file" | Set-Content -LiteralPath "$file.sha256" -Encoding ascii
          }
          $screens = @{
            'rollclip-window.png' = 'RollClip-Ana-Ekran.png'
            'rollclip-window.settings.png' = 'RollClip-Ayarlar.png'
            'rollclip-window.library.png' = 'RollClip-Klip-Galerisi.png'
            'rollclip-window.archive.png' = 'RollClip-Arsiv.png'
          }
          foreach ($entry in $screens.GetEnumerator()) {
            Copy-Item -LiteralPath "./release/screenshots/$($entry.Key)" -Destination $entry.Value -ErrorAction Stop
          }
          @'
          - Ayarlar kayıt, ses, klip kaydetme, paylaşım, görünüm ve depolama başlıkları altında düzenlendi.
          - İsteğe bağlı MP4 pano modu, yeni klibi otomatik yüklemeden dosya olarak panoya alır. Discord sohbetinde Ctrl+V ile eklenebilir.
          - Sol menü, tambur tipi süre seçici ve ayarlardan kapatılabilen akıcı ekran geçişleri eklendi.

          Windows 11 x64 için Setup ve taşınabilir ZIP, SHA-256 dosyalarıyla birlikte sunulur.
          '@ | Set-Content -LiteralPath release-notes.md -Encoding utf8
          $releaseAssets = @($asset, "$asset.sha256", $installer, "$installer.sha256") + @($screens.Values)
          gh release create $tag @releaseAssets --target $env:GITHUB_SHA --title "RollClip $tag · MP4 pano modu" --notes-file release-notes.md --prerelease
          if ($LASTEXITCODE -ne 0) { throw "GitHub prerelease could not be published." }
