name: Windows x64

on:
  push:
    branches: ['preview/rollclip-zip-quick']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore RollClip.slnx
      - name: Build
        run: dotnet build RollClip.slnx -c Release --no-restore
      - name: Test
        run: dotnet test RollClip.slnx -c Release --no-build --verbosity normal
      - name: Publish Windows x64
        run: dotnet publish src/RollClip.App -c Release -r win-x64 --self-contained true -o artifacts/win-x64
      - name: Bundle pinned Windows Graphics Capture engine
        shell: pwsh
        run: |
          ./tools/Install-CaptureEngine.ps1 -Destination artifacts/win-x64/ffmpeg
          $ffmpeg = (Resolve-Path ./artifacts/win-x64/ffmpeg/bin/ffmpeg.exe).Path
          $encoders = & $ffmpeg -hide_banner -encoders
          foreach ($encoder in 'h264_nvenc', 'h264_amf', 'h264_qsv', 'h264_mf') {
            if (-not ($encoders -match "\b$encoder\b")) { throw "Missing H.264 encoder: $encoder" }
          }
          $encoders -match '\bh264_(nvenc|amf|mf)\b'
      - name: Prepare clips for screenshot test
        shell: pwsh
        run: |
          $directory = New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP "rollclip-replay")
          foreach ($i in 0..1) {
            Copy-Item './artifacts/win-x64/Assets/ChromeLoop.mp4' (Join-Path $directory.FullName "replay-$i.mp4")
          }
      - name: Verify WPF startup and diagnostics clipboard
        shell: pwsh
        run: |
          $marker = Join-Path $env:RUNNER_TEMP "rollclip-window.txt"
          Remove-Item -LiteralPath $marker -ErrorAction SilentlyContinue
          $app = Start-Process -FilePath "./artifacts/win-x64/RollClip.exe" -ArgumentList "--smoke-test", "`"$marker`"" -PassThru
          if (-not $app.WaitForExit(30000)) {
            Stop-Process -Id $app.Id -Force
            throw "RollClip did not exit after rendering the window."
          }
          if (Test-Path -LiteralPath $marker) { Get-Content -LiteralPath $marker }
          if ($app.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $marker)) {
            throw "RollClip did not render the window successfully. Exit code: $($app.ExitCode)"
          }
          $screenshot = [IO.Path]::ChangeExtension($marker, ".png")
          if (-not (Test-Path -LiteralPath $screenshot)) {
            throw "WPF did not export the real application screenshot."
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RollClip-WPF-screenshot
          path: |
            ${{ runner.temp }}/rollclip-window*.png
            ${{ runner.temp }}/rollclip-window.txt
          if-no-files-found: error
